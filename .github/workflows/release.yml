name: Build, Sign and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Portable & Installer Editions (unsigned for CI signing)
        shell: powershell
        run: |
          .\build.ps1 -NoSign

      - name: Package unsigned binaries into zip
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\dist -Force | Out-Null
          Copy-Item ".\Windows Desktop Enhance.exe" .\dist\
          Copy-Item ".\Windows Desktop Enhance Setup.exe" .\dist\
          Compress-Archive -Path ".\dist\*.exe" -DestinationPath ".\unsigned.zip" -Force

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-enhance-unsigned
          path: .\unsigned.zip

      - name: Sign binaries with SignPath
        shell: powershell
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) {
            Write-Host "SIGNPATH_API_TOKEN is not set; skipping SignPath signing."
          } else {
            Install-Module -Name SignPath -Scope CurrentUser -Force
            Submit-SigningRequest `
              -ApiToken $env:SIGNPATH_API_TOKEN `
              -OrganizationId 'e7019df8-c938-45f4-8c5b-1728ea2cfdb9' `
              -ProjectSlug 'windows-desktop-enhance' `
              -SigningPolicySlug 'release-signing' `
              -InputArtifactPath '.\unsigned.zip' `
              -OutputArtifactPath '.\signed.zip' `
              -WaitForCompletion
            Expand-Archive -Path '.\signed.zip' -DestinationPath '.\dist' -Force
          }

      - name: Upload final build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-enhance-release
          path: .\dist\*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Windows Desktop Enhance.exe
            dist/Windows Desktop Enhance Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
