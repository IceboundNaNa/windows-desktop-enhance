name: Build, Sign and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Portable & Installer Editions (unsigned for CI signing)
        shell: powershell
        run: |
          .\build.ps1 -NoSign

      - name: Package artifacts for SignPath
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\dist -Force | Out-Null
          Copy-Item ".\Windows Desktop Enhance.exe" .\dist\
          Copy-Item ".\Windows Desktop Enhance Setup.exe" .\dist\

      - name: Upload build artifacts
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-enhance-unsigned
          path: .\dist\*.exe

      - name: Submit signing request to SignPath
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 'e7019df8-c938-45f4-8c5b-1728ea2cfdb9'
          project-slug: 'windows-desktop-enhance'
          signing-policy-slug: 'release-signing'
          github-artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: './signed'

      - name: Prepare final release files
        shell: powershell
        run: |
          if (Test-Path .\signed) {
            Write-Host "Using SignPath signed binaries"
            Copy-Item .\signed\* .\dist\ -Force
          } else {
            Write-Host "SIGNPATH_API_TOKEN not set; using unsigned CI binaries"
          }

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Windows Desktop Enhance.exe
            dist/Windows Desktop Enhance Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
